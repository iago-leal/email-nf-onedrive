[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-nf-onedrive"
version = "0.1.0"
description = "Arquiva no OneDrive as notas fiscais e os boletos recebidos por e-mail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
email-nf-onedrive = "email_nf_onedrive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_nf_onedrive = ["registro/esquema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracao: testes que usam processos externos (rclone) ou exercitam o ciclo completo",
]
